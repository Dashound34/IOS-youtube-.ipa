name: Build iOS app (.ipa)

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add app icon from build/icon.png
        run: |
          ICONSET=App/Assets.xcassets/AppIcon.appiconset
          if [ -f ../build/icon.png ]; then
            sips -z 1024 1024 -s format png ../build/icon.png --out "$ICONSET/icon.png"
            printf '%s\n' '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICONSET/Contents.json"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project RanchYouTube.xcodeproj -scheme RanchYouTube \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YouTube.app Payload/
          zip -qry YouTube-iOS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-iOS
          path: ios/YouTube-iOS.ipa

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/YouTube-iOS.ipa
